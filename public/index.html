<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Play Teen Patti with friends in real time — no signup needed">
  <meta name="theme-color" content="#0a3020">
  <title>Teen Patti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Toast container -->
<div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="false"></div>

<!-- Confetti canvas -->
<canvas id="confetti-canvas" aria-hidden="true"></canvas>

<!-- ══════════════════════════════════════════════════════
     SCREEN 1 · LOBBY
     ══════════════════════════════════════════════════════ -->
<section class="screen active" id="screen-lobby" aria-label="Lobby">
  <div class="lobby-wrap">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon" aria-hidden="true">
        <!-- Crown icon -->
        <svg width="38" height="32" viewBox="0 0 38 32" fill="none">
          <path d="M3 28L7 13L14 20L19 6L24 20L31 13L35 28H3Z" fill="#1a1208" stroke="#1a1208" stroke-linejoin="round"/>
          <circle cx="3"  cy="13" r="3" fill="#1a1208"/>
          <circle cx="19" cy="6"  r="3" fill="#1a1208"/>
          <circle cx="35" cy="13" r="3" fill="#1a1208"/>
          <rect x="2" y="28" width="34" height="4" rx="2" fill="#1a1208"/>
        </svg>
      </div>
      <h1>Teen Patti</h1>
      <div class="logo-sub">Real‑Time · Multiplayer</div>
    </div>

    <!-- Form card -->
    <div class="card-form">

      <!-- Name -->
      <div class="form-group">
        <label for="lobby-name">Your Name</label>
        <input type="text" id="lobby-name" maxlength="16"
               placeholder="Enter your name" autocomplete="nickname" spellcheck="false" aria-required="true">
      </div>

      <!-- Create -->
      <button class="btn btn-primary btn-full" id="btn-create">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 2a1 1 0 011 1v4h4a1 1 0 010 2H9v4a1 1 0 01-2 0V9H3a1 1 0 010-2h4V3a1 1 0 011-1z"/>
        </svg>
        Create Room
      </button>

      <div class="divider" style="margin:18px 0 14px">or join</div>

      <!-- Code -->
      <div class="form-group" style="margin-bottom:12px">
        <label for="lobby-code">Room Code</label>
        <input type="text" id="lobby-code" maxlength="4" placeholder="ABCD"
               autocomplete="off" spellcheck="false"
               style="text-transform:uppercase;letter-spacing:0.25em;font-size:1.4rem;font-weight:800;text-align:center;font-family:'Playfair Display',serif"
               aria-label="4-letter room code">
      </div>

      <button class="btn btn-neutral btn-full" id="btn-join">
        Join Room
      </button>

    </div>

    <!-- Past games -->
    <div class="past-games-section" id="past-games-section" style="display:none">
      <h3>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
          <path d="M6 1a5 5 0 100 10A5 5 0 006 1zm.5 5.35l-1.75 1.3a.5.5 0 01-.6-.8L5.5 5.7V3.5a.5.5 0 011 0v3.18l-.15.11-.35.16z"/>
        </svg>
        Past Games
      </h3>
      <div id="past-games-list"></div>
    </div>

    <!-- Theme toggle -->
    <button class="theme-btn" id="theme-toggle" aria-label="Toggle light/dark theme">
      <svg id="theme-icon-dark" width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
      </svg>
      <svg id="theme-icon-light" width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" style="display:none">
        <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
      </svg>
    </button>

  </div>
</section>

<!-- ══════════════════════════════════════════════════════
     SCREEN 2 · WAITING ROOM
     ══════════════════════════════════════════════════════ -->
<section class="screen" id="screen-room" aria-label="Waiting room">

  <!-- Header -->
  <div class="room-header">
    <div>
      <div class="room-code-label">Room Code</div>
      <div class="room-code" id="room-code-display" aria-label="Room code">——</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-sm btn-ghost" id="btn-copy-code" aria-label="Copy room code">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="4" y="4" width="8" height="8" rx="1.5"/>
          <path d="M2 10V3a1 1 0 011-1h7" stroke-linecap="round"/>
        </svg>
        Copy
      </button>
      <button class="theme-btn" id="theme-toggle-2" aria-label="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Players -->
  <div class="player-list" id="room-player-list" role="list" aria-label="Players in room"></div>

  <!-- Settings -->
  <div class="settings-panel" id="settings-panel">
    <h3>Game Settings</h3>
    <div class="settings-grid">
      <div class="settings-item">
        <label for="setting-boot">Boot Amount</label>
        <input type="number" id="setting-boot" min="1" max="500" value="10">
      </div>
      <div class="settings-item">
        <label for="setting-limit">Stake Limit ×</label>
        <input type="number" id="setting-limit" min="2" max="32" value="8">
      </div>
    </div>
    <div class="toggle-wrap">
      <div>
        <div style="font-size:0.88rem;font-weight:600">Point Mode</div>
        <div style="font-size:0.72rem;color:var(--text-muted);margin-top:2px">Track points across rounds</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="setting-points" aria-label="Enable point mode">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <!-- Start bar -->
  <div class="start-bar">
    <div id="waiting-message"></div>
    <button class="btn btn-primary btn-full" id="btn-start-game" disabled aria-label="Start game">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3l9 5-9 5V3z"/></svg>
      Start Game
    </button>
    <button class="btn btn-ghost btn-full" id="btn-leave-room" style="margin-top:8px" aria-label="Leave room">
      Leave Room
    </button>
  </div>

</section>

<!-- ══════════════════════════════════════════════════════
     SCREEN 3 · GAME TABLE
     ══════════════════════════════════════════════════════ -->
<section class="screen" id="screen-game" aria-label="Game table">

  <!-- Top bar -->
  <div class="game-topbar">
    <div class="topbar-code">
      <strong id="game-code-display">——</strong>
    </div>
    <div class="topbar-round" id="game-round-label">Round 1</div>
    <div class="topbar-btns">
      <button class="btn btn-sm btn-neutral" id="btn-scoreboard" aria-label="View scoreboard">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
          <rect x="1" y="8" width="3" height="5" rx="1"/>
          <rect x="5.5" y="5" width="3" height="8" rx="1"/>
          <rect x="10" y="2" width="3" height="11" rx="1"/>
        </svg>
        Scores
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-area" id="table-area" aria-label="Game table">
    <!-- Outer wooden rail -->
    <div class="table-rail" aria-hidden="true"></div>
    <!-- Blue felt surface -->
    <div class="table-cloth" aria-hidden="true"></div>

    <!-- Winner top banner (small, inside table) -->
    <div class="winner-banner" id="winner-banner" aria-live="assertive"></div>

    <!-- Pot display — centre of table -->
    <div class="pot-display" id="pot-display">
      <div class="pot-inner">
        <div class="pot-chip" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="9" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
            <text x="10" y="14" text-anchor="middle" font-size="9" font-weight="900" fill="#fff" font-family="serif">₹</text>
          </svg>
        </div>
        <div class="pot-amount-wrap">
          <div class="pot-label">Pot</div>
          <div class="pot-amount" id="pot-amount" aria-live="polite" aria-label="Pot amount">0</div>
        </div>
      </div>
    </div>

    <!-- Round end overlay banner -->
    <div class="round-end-banner" id="round-end-banner" aria-live="assertive" aria-atomic="true">
      <div class="reb-label">Winner</div>
      <div class="winner-name" id="banner-winner-name"></div>
      <div class="hand-type" id="banner-hand-type"></div>
    </div>

    <!-- Player seats (JS-populated) -->
    <div id="seats-container" aria-label="Player seats"></div>
  </div>

  <!-- My cards -->
  <div class="my-cards-area" id="my-cards-area" aria-label="Your cards" role="group"></div>

  <!-- Action bar -->
  <div class="action-bar" id="action-bar">
    <div class="action-info" id="action-info" aria-live="polite"></div>

    <div class="action-row">
      <!-- See -->
      <button class="action-btn btn-see" id="btn-see" disabled aria-label="See your cards">
        <svg width="15" height="15" viewBox="0 0 20 14" fill="currentColor" aria-hidden="true">
          <path d="M10 0C5.5 0 1 7 1 7s4.5 7 9 7 9-7 9-7S14.5 0 10 0zm0 11.5a4.5 4.5 0 110-9 4.5 4.5 0 010 9zM10 5a2 2 0 100 4 2 2 0 000-4z"/>
        </svg>
        See
      </button>
      <!-- Chaal -->
      <button class="action-btn btn-chaal" id="btn-chaal" disabled aria-label="Chaal — call the bet">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="10" cy="10" r="8"/>
          <path d="M10 6v4l2.5 2.5" stroke-linecap="round"/>
        </svg>
        Chaal
      </button>
      <!-- Raise -->
      <button class="action-btn btn-raise" id="btn-raise" disabled aria-label="Raise the bet">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10 2l2 4.5 5 .7-3.5 3.5.8 4.8L10 13l-4.3 2.5.8-4.8L3 7.2l5-.7z"/>
        </svg>
        Raise
      </button>
    </div>

    <div class="action-row">
      <!-- Pack -->
      <button class="action-btn btn-pack" id="btn-pack" disabled aria-label="Pack — fold your hand">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15"/>
        </svg>
        Pack
      </button>
      <!-- Show -->
      <button class="action-btn btn-show" id="btn-show" disabled aria-label="Show cards">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="2" y="5" width="11" height="14" rx="2"/>
          <rect x="7" y="2" width="11" height="14" rx="2" fill="var(--felt)" stroke="currentColor"/>
        </svg>
        Show
      </button>
    </div>

    <!-- Next round / waiting -->
    <div id="game-status-bar" style="display:none">
      <div id="game-status-msg"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-full" id="btn-next-round" style="display:none" aria-label="Start next round">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3l9 5-9 5V3z"/></svg>
          Next Round
        </button>
        <button class="btn btn-danger btn-full" id="btn-end-game" style="display:none" aria-label="End game and see results">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 1a7 7 0 100 14A7 7 0 008 1zM5 7h6v2H5V7z"/>
          </svg>
          End Game
        </button>
      </div>
    </div>
  </div>

</section>

<!-- ══════════════════════════════════════════════════════
     SCREEN 4 · FINAL RESULTS + SETTLEMENT
     ══════════════════════════════════════════════════════ -->
<section class="screen" id="screen-results" aria-label="Final results">

  <div class="results-header">
    <div class="results-header-inner">
      <div class="results-trophy" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
          <path d="M8 21h8M12 17v4M5 3H3a2 2 0 000 4c0 3.3 2.1 6 5.1 7A6 6 0 0012 18a6 6 0 003.9-4C18.9 13 21 10.3 21 7a2 2 0 00-2-4h-2V3H5z"
                stroke="#f5c842" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 7h2M19 7h2" stroke="#f5c842" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h2 class="results-title">Game Over</h2>
        <p class="results-subtitle" id="results-subtitle">0 rounds played</p>
      </div>
    </div>
  </div>

  <!-- Winner spotlight -->
  <div class="winner-spotlight" id="winner-spotlight">
    <div class="winner-crown" aria-hidden="true">
      <svg width="30" height="26" viewBox="0 0 38 32" fill="none">
        <path d="M3 28L7 13L14 20L19 6L24 20L31 13L35 28H3Z" fill="#f5c842"/>
        <circle cx="3"  cy="13" r="3" fill="#f5c842"/>
        <circle cx="19" cy="6"  r="3" fill="#f5c842"/>
        <circle cx="35" cy="13" r="3" fill="#f5c842"/>
        <rect x="2" y="28" width="34" height="3" rx="1.5" fill="#f5c842"/>
      </svg>
    </div>
    <div class="winner-avatar" id="winner-avatar" aria-hidden="true"></div>
    <div class="winner-label">Winner</div>
    <div class="winner-name-big" id="winner-name-big"></div>
    <div class="winner-chips-big" id="winner-chips-big"></div>
  </div>

  <!-- Final standings -->
  <div class="results-section">
    <div class="results-section-title">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
        <rect x="1" y="8" width="3" height="5" rx="1"/><rect x="5.5" y="5" width="3" height="8" rx="1"/><rect x="10" y="2" width="3" height="11" rx="1"/>
      </svg>
      Final Standings
    </div>
    <div class="standings-list" id="standings-list" role="list"></div>
  </div>

  <!-- ── DEBT SETTLEMENT ── -->
  <div class="settlement-section">
    <div class="results-section-title" style="padding:0 2px;margin-bottom:9px">
      <svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path d="M10 1a9 9 0 100 18A9 9 0 0010 1zm-.5 4h1v1.5a3 3 0 010 5V13h-1v-1.5a3 3 0 010-5V5zm.5 2a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm0 4.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/>
      </svg>
      Who Pays Whom
      <span id="settle-basis" style="font-size:0.6rem;color:var(--text-muted);margin-left:4px;text-transform:none;letter-spacing:0">(chips)</span>
    </div>
    <div class="settlement-box">
      <div class="settlement-box-title">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M4 10h12M14 6l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </svg>
        Settlement — minimum transactions
      </div>
      <div id="settlement-list"></div>
    </div>
  </div>

  <!-- Round by round -->
  <div class="results-section">
    <div class="results-section-title">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
        <path d="M7 1a6 6 0 100 12A6 6 0 007 1zm.5 8.35l-2 1.5a.5.5 0 01-.6-.8l1.6-1.2V4.5a.5.5 0 011 0v4.68l-.17.12z"/>
      </svg>
      Round by Round
    </div>
    <div class="round-summary-list" id="round-summary-list"></div>
  </div>

  <!-- Actions -->
  <div class="results-actions">
    <button class="btn btn-primary btn-full" id="btn-play-again">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path d="M4 10a6 6 0 1110.83-3.5M14 3v4h-4"/>
      </svg>
      Play Again
    </button>
    <button class="btn btn-ghost btn-full" id="btn-back-lobby">Back to Lobby</button>
  </div>

</section>

<!-- ══════════════════════════════════════════════════════
     SCOREBOARD OVERLAY
     ══════════════════════════════════════════════════════ -->
<div class="scoreboard-overlay" id="scoreboard-overlay"
     role="dialog" aria-modal="true" aria-label="Scoreboard">
  <div class="scoreboard-panel">

    <div class="scoreboard-header">
      <h2>
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
        Scoreboard
      </h2>
      <button class="btn btn-sm btn-ghost" id="btn-close-scoreboard" aria-label="Close scoreboard">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M2 2l10 10M12 2L2 12"/>
        </svg>
        Close
      </button>
    </div>

    <div class="scoreboard-list" id="scoreboard-list" role="list" aria-label="Player scores"></div>

    <div class="round-history" id="round-history">
      <h3>Round History</h3>
      <div id="round-history-list"></div>
    </div>

  </div>
</div>

<!-- Scripts -->
<script src="/socket.io/socket.io.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/app.js"></script>
<script src="/js/lobby.js"></script>
<script src="/js/room.js"></script>
<script src="/js/game.js"></script>
<script src="/js/scoreboard.js"></script>
<script src="/js/results.js"></script>
</body>
</html>
